<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Resources — IzVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
:root{--bg:#09090c;--surface:#15151b;--surface2:#1c1c24;--line:#32323d;--text:#f7f6fb;--muted:#9d9baa;--gold:#d9b23f;--purple:#9b6cff;--cyan:#35cfe0;--danger:#ff7187}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 5%,rgba(217,178,63,.09),transparent 28%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;padding-bottom:40px}a{color:inherit;text-decoration:none}.top{height:72px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;background:rgba(9,9,12,.9);backdrop-filter:blur(18px)}.brand{font:700 25px 'Space Grotesk';letter-spacing:.02em}.brand span{color:var(--gold)}.back{color:var(--muted)}main{max-width:1200px;margin:auto;padding:34px 5vw}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:25px}.eyebrow{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.16em}.hero h1{font:700 38px 'Space Grotesk';margin:5px 0}.hero p{margin:0;color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:11px 15px;font-weight:600}.btn:hover{border-color:var(--gold);transform:translateY(-1px)}.btn.primary{border:0;background:linear-gradient(135deg,var(--purple),var(--cyan))}.search{flex:1;min-width:220px}.search input{width:100%;padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);outline:0}.search input:focus{border-color:var(--purple)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}.stat b{display:block;font-size:23px}.stat span{color:var(--muted);font-size:12px}.path{display:flex;align-items:center;gap:7px;overflow:auto;margin:8px 0 16px;color:var(--muted);font-size:14px}.path button{background:none;border:0;color:var(--text);cursor:pointer;font:inherit}.path button:hover{color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.item{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:17px;min-height:145px;display:flex;flex-direction:column;justify-content:space-between;transition:.2s}.item:hover{border-color:rgba(217,178,63,.55);transform:translateY(-2px)}.itemtop{display:flex;justify-content:space-between;gap:10px}.icon{width:45px;height:45px;border-radius:13px;background:var(--surface2);display:grid;place-items:center;color:var(--gold);font-size:20px}.name{font-weight:600;line-height:1.35;word-break:break-word;margin-top:13px}.meta{font-size:11px;color:var(--muted);margin-top:5px}.itemactions{display:flex;gap:6px;margin-top:12px}.mini{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;padding:7px;font-size:11px}.mini:hover{color:var(--text);border-color:var(--purple)}.empty{grid-column:1/-1;text-align:center;padding:65px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal.show{display:flex}.sheet{width:min(480px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px}.sheet h2{margin-top:0}.sheet p{color:var(--muted);font-size:13px}.sheet input{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);color:var(--text);outline:0;margin:8px 0 14px}.modal-actions{display:flex;gap:8px;justify-content:flex-end}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line);padding:11px 15px;border-radius:12px;z-index:200;box-shadow:0 15px 35px #0008;font-size:13px}.hidden{display:none!important}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:30px}}@media(max-width:520px){main{padding:25px 16px}.top{padding:0 16px}.grid{grid-template-columns:1fr 1fr;gap:9px}.item{padding:13px;min-height:135px}.stats{gap:8px}.stat{padding:12px}.hero{display:block}.hero .btn{margin-top:15px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="index.html">IZ<span>VAULT</span></a><a class="back" href="index.html">← Back to IzVault</a></header>
<main>
<section class="hero"><div><div class="eyebrow">CLOUD RESOURCES</div><h1>My Files</h1><p>Organise your work, projects and downloads in the cloud.</p></div><button class="btn primary" id="uploadBtn"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Files</button></section>
<div class="toolbar"><div class="search"><input id="search" placeholder="Search files and folders..." autocomplete="off"></div><button class="btn" id="newFolderBtn"><i class="fa-solid fa-folder-plus"></i> New Folder</button><button class="btn" id="refreshBtn"><i class="fa-solid fa-rotate"></i></button></div>
<div class="stats"><div class="stat"><span>Files</span><b id="fileCount">0</b></div><div class="stat"><span>Folders</span><b id="folderCount">0</b></div><div class="stat"><span>Current Folder</span><b id="currentFolder">Root</b></div><div class="stat"><span>Account</span><b id="accountName">—</b></div></div>
<div class="path" id="path"></div><div class="grid" id="grid"></div>
</main>
<input id="fileInput" type="file" multiple hidden>
<div class="modal" id="folderModal"><div class="sheet"><h2>New Folder</h2><p>Create a folder inside the current location.</p><input id="folderName" placeholder="Folder name" maxlength="80"><div class="modal-actions"><button class="btn" data-close="folderModal">Cancel</button><button class="btn primary" id="createFolder">Create Folder</button></div></div></div>
<div class="modal" id="renameModal"><div class="sheet"><h2>Rename</h2><p>Enter a new name.</p><input id="renameName" maxlength="160"><div class="modal-actions"><button class="btn" data-close="renameModal">Cancel</button><button class="btn primary" id="renameSave">Save</button></div></div></div>
<div class="modal" id="deleteModal"><div class="sheet"><h2>Delete item?</h2><p id="deleteText">This action cannot be undone.</p><div class="modal-actions"><button class="btn" data-close="deleteModal">Cancel</button><button class="btn" id="deleteConfirm" style="color:var(--danger)">Delete</button></div></div></div>
<div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="resources.js"></script>
</body></html>
