name: Fix Resources polish
on:
  push:
    branches: [feature/resources-wave-polish]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix escaped newlines in Resources polish
        shell: python
        run: |
          from pathlib import Path
          p = Path('resources.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* ReadVault-inspired IZVAULT Resources visual polish — background only */'
          if marker in s:
              start = s.index(marker)
              end = s.index('</style>', start)
              block = s[start:end].replace('\\n', '\n')
              s = s[:start] + block + s[end:]
              p.write_text(s, encoding='utf-8')
      - name: Commit and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources.html
          git rm -f .github/workflows/fix-resources-polish.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Resources polish formatting"
          git push
