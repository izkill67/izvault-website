<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReadVault — Cloud Reading Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080e;--bg2:#0f0f18;--bg3:#161622;--card:#1a1a28;--border:#252535;--accent:#a78bfa;--accent2:#67e8f9;--gold:#fbbf24;--green:#34d399;--red:#fb7185;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--glow:rgba(167,139,250,.12)}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Outfit,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}header{height:64px;position:sticky;top:0;z-index:20;background:rgba(8,8,14,.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 2rem}.logo{font:700 1.35rem 'Playfair Display',serif}.logo em{font-style:normal;color:var(--accent)}.head-right{display:flex;gap:1rem;align-items:center;color:var(--text2);font-size:.78rem}.back{color:var(--text2);text-decoration:none;border:1px solid var(--border);padding:.45rem .8rem;border-radius:9px}.back:hover{color:var(--text);background:var(--bg3)}main{max-width:1320px;margin:auto;padding:1.6rem}.toolbar{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}.search{flex:1;min-width:220px}.input,select,textarea{width:100%;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:.65rem .85rem;outline:none}.input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:.65rem 1rem}.btn:hover{border-color:var(--accent)}.btn-primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600}.tabs{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:1.4rem}.tab{border:1px solid var(--border);background:transparent;color:var(--text2);border-radius:999px;padding:.4rem .85rem}.tab.active{color:var(--accent);border-color:var(--accent);background:var(--glow)}.count{background:var(--bg3);border-radius:999px;padding:1px 6px;margin-left:3px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:1rem}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.cover{aspect-ratio:2/3;background:linear-gradient(135deg,var(--bg3),var(--card));position:relative}.cover img{width:100%;height:100%;object-fit:cover}.nocover{height:100%;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:.8rem}.status{position:absolute;top:7px;left:7px;border-radius:999px;padding:3px 8px;font-size:.65rem;background:rgba(0,0,0,.65);backdrop-filter:blur(8px)}.body{padding:.85rem;display:flex;flex-direction:column;gap:.35rem;flex:1}.title{font-weight:600;line-height:1.35}.muted{font-size:.73rem;color:var(--text2)}.bar{height:4px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:.25rem}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:.35rem}.stars{color:var(--gold);font-size:.75rem}.actions{display:flex;gap:.35rem;padding:0 .85rem .85rem}.small{flex:1;padding:.4rem;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:.72rem}.small:hover{color:var(--text);background:var(--bg3)}.small.delete:hover{color:var(--red);border-color:var(--red)}.empty{text-align:center;padding:5rem 1rem;color:var(--text3);grid-column:1/-1}.empty h3{color:var(--text2);margin:.6rem 0}.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:1rem}.modal.show{display:flex}.box{width:min(520px,100%);max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--border);border-radius:18px}.mh{padding:1rem 1.2rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.mh strong{font:600 1.1rem 'Playfair Display',serif;color:var(--accent)}.mb{padding:1.2rem}.group{margin-bottom:.85rem}.group label{display:block;color:var(--text2);font-size:.76rem;margin-bottom:.35rem}.row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.save{width:100%;padding:.75rem;border:0;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600}.notice{display:none;text-align:center;padding:4rem 1rem;color:var(--text2)}.notice.show{display:block}.notice h2{margin-bottom:.5rem;color:var(--text)}.sync{color:var(--green)}@media(max-width:580px){header{padding:0 1rem}.head-right span{display:none}main{padding:1rem}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}.row{grid-template-columns:1fr}.toolbar .btn{flex:1}}
</style>
</head>
<body>
<header><a class="back" href="index.html">← IzVault</a><div class="logo">Read<em>Vault</em></div><div class="head-right"><span class="sync" id="syncState">● Cloud</span><span id="userLabel"></span></div></header>
<main>
<div id="loginNotice" class="notice"><h2>Login required</h2><p>Login to IzVault first so your reading list can be saved to the cloud.</p><br><a class="btn btn-primary" href="index.html">Go to IzVault Login</a></div>
<section id="app" style="display:none">
<div class="toolbar"><div class="search"><input class="input" id="search" placeholder="Search title..."></div><select id="type" style="max-width:150px"><option value="">All Types</option><option>Novel</option><option>Manhwa</option><option>Manhua</option><option>Manga</option><option>Light Novel</option><option>Webtoon</option><option>Other</option></select><select id="sort" style="max-width:150px"><option value="newest">Newest</option><option value="title">A–Z</option><option value="rating">Rating</option><option value="progress">Progress</option></select><button class="btn btn-primary" id="addBtn">＋ Add</button></div>
<div class="tabs"><button class="tab active" data-status="">All <span class="count" id="c-all">0</span></button><button class="tab" data-status="Reading">📖 Reading <span class="count" id="c-reading">0</span></button><button class="tab" data-status="Completed">✅ Completed <span class="count" id="c-completed">0</span></button><button class="tab" data-status="On Hold">⏸ On Hold <span class="count" id="c-hold">0</span></button><button class="tab" data-status="Plan to Read">📌 Plan <span class="count" id="c-plan">0</span></button></div>
<div class="grid" id="grid"></div>
</section>
</main>
<div class="modal" id="modal"><div class="box"><div class="mh"><strong id="modalTitle">Add Entry</strong><button class="btn" id="close">×</button></div><div class="mb"><div class="group"><label>Title *</label><input class="input" id="f-title" required></div><div class="row"><div class="group"><label>Type</label><select id="f-type"><option>Novel</option><option>Manhwa</option><option>Manhua</option><option>Manga</option><option>Light Novel</option><option>Webtoon</option><option>Other</option></select></div><div class="group"><label>Status</label><select id="f-status"><option>Reading</option><option>Completed</option><option>On Hold</option><option>Plan to Read</option></select></div></div><div class="row"><div class="group"><label>Current Chapter</label><input class="input" id="f-cur" type="number" min="0" value="0"></div><div class="group"><label>Total Chapter</label><input class="input" id="f-total" type="number" min="0" value="0"></div></div><div class="group"><label>Cover URL</label><input class="input" id="f-cover" type="url" placeholder="https://..."></div><div class="group"><label>Read Link</label><input class="input" id="f-link" type="url" placeholder="https://..."></div><div class="group"><label>Rating (0–5)</label><input class="input" id="f-rating" type="number" min="0" max="5" step="1" value="0"></div><div class="group"><label>Notes / Review</label><textarea id="f-notes" rows="4" placeholder="Your thoughts..."></textarea></div><button class="save" id="save">Save to Cloud</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://imkbmemvoqbbedbljueu.supabase.co';
const SUPABASE_KEY='sb_publishable_Dosi6rJmV4SaGzLEClAYUA_1L2CdDfE';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,books=[],filterStatus='',editingId=null;
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}
function pct(b){return b.total_chapter?Math.min(100,Math.round((b.current_chapter||0)/b.total_chapter*100)):0}
function stars(n){return '★★★★★'.slice(0,n||0)+'☆☆☆☆☆'.slice(0,5-(n||0))}
function setNotice(){ $('loginNotice').classList.add('show');$('app').style.display='none'; }
function showApp(){ $('loginNotice').classList.remove('show');$('app').style.display='block';$('userLabel').textContent=user.email||''; }
async function init(){const {data}=await sb.auth.getSession();user=data.session?.user||null;if(!user){setNotice();return}showApp();await loadBooks();}
async function loadBooks(){ $('syncState').textContent='● Syncing...';const {data,error}=await sb.from('books').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(error){console.error(error);$('syncState').textContent='● Cloud error';alert('Tak dapat baca data cloud: '+error.message);return}books=data||[];$('syncState').textContent='● Cloud synced';render();counts();}
function filtered(){const q=$('search').value.trim().toLowerCase(),t=$('type').value,s=$('sort').value;let a=books.filter(b=>(!q||b.title.toLowerCase().includes(q))&&(!t||b.type===t)&&(!filterStatus||b.status===filterStatus));if(s==='title')a.sort((x,y)=>x.title.localeCompare(y.title));if(s==='rating')a.sort((x,y)=>(y.rating||0)-(x.rating||0));if(s==='progress')a.sort((x,y)=>pct(y)-pct(x));return a}
function render(){const a=filtered();$('grid').innerHTML=a.length?a.map(b=>`<article class="card"><div class="cover">${b.cover_url?`<img src="${esc(b.cover_url)}" alt="">`:'<div class="nocover">No cover</div>'}<span class="status">${esc(b.status)}</span></div><div class="body"><div class="title">${esc(b.title)}</div><div class="muted">${esc(b.type)} · Ch. ${b.current_chapter||0}${b.total_chapter?' / '+b.total_chapter:''}</div><div class="bar"><div class="fill" style="width:${pct(b)}%"></div></div><div class="bottom"><span class="stars">${stars(b.rating)}</span><span class="muted">${pct(b)}%</span></div></div><div class="actions"><button class="small" onclick="editBook(${b.id})">Edit</button>${b.link?`<button class="small" onclick="window.open('${esc(b.link)}','_blank','noopener')">Read</button>`:''}<button class="small delete" onclick="deleteBook(${b.id})">Delete</button></div></article>`).join(''):'<div class="empty"><h3>No entries found</h3><p>Add your first book. It will be saved to Supabase Cloud.</p></div>'}
function counts(){const n=s=>books.filter(b=>b.status===s).length;$('c-all').textContent=books.length;$('c-reading').textContent=n('Reading');$('c-completed').textContent=n('Completed');$('c-hold').textContent=n('On Hold');$('c-plan').textContent=n('Plan to Read')}
function openModal(b=null){editingId=b?.id||null;$('modalTitle').textContent=b?'Edit Entry':'Add Entry';$('f-title').value=b?.title||'';$('f-type').value=b?.type||'Novel';$('f-status').value=b?.status||'Reading';$('f-cur').value=b?.current_chapter||0;$('f-total').value=b?.total_chapter||0;$('f-cover').value=b?.cover_url||'';$('f-link').value=b?.link||'';$('f-rating').value=b?.rating||0;$('f-notes').value=b?.notes||'';$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
async function saveBook(){if(!user)return;const title=$('f-title').value.trim();if(!title)return alert('Title wajib diisi.');const payload={user_id:user.id,title,type:$('f-type').value,status:$('f-status').value,current_chapter:Math.max(0,Number($('f-cur').value)||0),total_chapter:Math.max(0,Number($('f-total').value)||0),cover_url:$('f-cover').value.trim()||null,link:$('f-link').value.trim()||null,rating:Math.min(5,Math.max(0,Number($('f-rating').value)||0)),notes:$('f-notes').value.trim()||null};$('save').disabled=true;$('save').textContent='Saving...';let result;if(editingId)result=await sb.from('books').update(payload).eq('id',editingId).eq('user_id',user.id);else result=await sb.from('books').insert(payload);$('save').disabled=false;$('save').textContent='Save to Cloud';if(result.error){alert('Gagal simpan: '+result.error.message);return}closeModal();await loadBooks()}
window.editBook=id=>{const b=books.find(x=>x.id===id);if(b)openModal(b)};
window.deleteBook=async id=>{if(!confirm('Padam entry ini?'))return;const {error}=await sb.from('books').delete().eq('id',id).eq('user_id',user.id);if(error)return alert('Gagal padam: '+error.message);await loadBooks()};
$('addBtn').onclick=()=>openModal();$('close').onclick=closeModal;$('save').onclick=saveBook;$('search').oninput=render;$('type').onchange=render;$('sort').onchange=render;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');filterStatus=t.dataset.status;render()});sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;if(user){showApp();loadBooks()}else setNotice()});init();
</script>
</body>
</html>
