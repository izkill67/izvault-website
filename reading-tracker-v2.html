<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReadVault — Reading Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080e;--bg2:#0f0f18;--bg3:#161622;--card:#1a1a28;--border:#252535;--accent:#a78bfa;--accent2:#67e8f9;--gold:#fbbf24;--green:#34d399;--red:#fb7185;--text:#e2e8f0;--muted:#94a3b8;--dim:#64748b;--glow:rgba(167,139,250,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Outfit,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}header{height:64px;position:sticky;top:0;z-index:30;background:rgba(8,8,14,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem}.logo{font:700 1.35rem 'Playfair Display',serif}.logo em{font-style:normal;color:var(--accent)}.head{display:flex;align-items:center;gap:.6rem}.back,.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:.58rem .85rem;text-decoration:none}.btn:hover{border-color:var(--accent)}.primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600}.sync{color:var(--green);font-size:.76rem}.user{color:var(--muted);font-size:.76rem;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:1320px;margin:auto;padding:1.25rem}.toolbar{display:flex;gap:.65rem;align-items:center;flex-wrap:wrap}.search{flex:1;min-width:200px}.input,select,textarea{width:100%;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:.62rem .8rem;outline:none}.input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}.tools{display:flex;gap:.45rem;flex-wrap:wrap;margin:1rem 0}.tabs{display:flex;gap:.45rem;flex-wrap:wrap;margin:1rem 0 1.35rem}.tab{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:999px;padding:.4rem .8rem}.tab.active{color:var(--accent);border-color:var(--accent);background:var(--glow)}.count{background:var(--bg3);border-radius:999px;padding:1px 6px;margin-left:3px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:1rem}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.cover{aspect-ratio:2/3;background:linear-gradient(135deg,var(--bg3),var(--card));position:relative}.cover img{width:100%;height:100%;object-fit:cover}.nocover{height:100%;display:flex;align-items:center;justify-content:center;color:var(--dim)}.status{position:absolute;top:7px;left:7px;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.68);font-size:.65rem}.body{padding:.8rem;display:flex;flex-direction:column;gap:.3rem;flex:1}.title{font-weight:600;line-height:1.35}.muted{color:var(--muted);font-size:.72rem}.bar{height:4px;background:var(--border);border-radius:4px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:auto}.stars{color:var(--gold);letter-spacing:-1px}.actions{display:flex;gap:.35rem;padding:0 .8rem .8rem}.small{flex:1;padding:.4rem;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:7px;font-size:.72rem}.small:hover{background:var(--bg3);color:var(--text)}.delete:hover{color:var(--red);border-color:var(--red)}.empty{grid-column:1/-1;text-align:center;padding:5rem;color:var(--dim)}
.notice{text-align:center;padding:5rem 1rem}.notice h2{margin-bottom:.5rem}.notice p{color:var(--muted)}.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:1rem}.modal.show{display:flex}.box{width:min(620px,100%);max-height:94vh;overflow:auto;background:var(--bg2);border:1px solid var(--border);border-radius:18px}.mh{position:sticky;top:0;z-index:2;background:var(--bg2);padding:1rem 1.2rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.mh strong{font:600 1.1rem 'Playfair Display',serif;color:var(--accent)}.mb{padding:1.2rem}.group{margin-bottom:.8rem}.group label{display:block;color:var(--muted);font-size:.76rem;margin-bottom:.35rem}.row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.cover-row{display:grid;grid-template-columns:150px 1fr;gap:1rem;align-items:start}.preview{width:150px;aspect-ratio:2/3;background:var(--bg3);border:1px dashed var(--border);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--dim);text-align:center;font-size:.72rem}.preview img{width:100%;height:100%;object-fit:cover}.save{width:100%;padding:.75rem;border:0;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600}.hint{color:var(--dim);font-size:.7rem;margin-top:.35rem}.detect{display:flex;gap:.45rem}.detect .input{flex:1}.detect button{white-space:nowrap}.statusmsg{font-size:.75rem;color:var(--muted);min-height:1em;margin-top:.35rem}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem}.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.85rem}.stat b{display:block;font-size:1.35rem;margin-top:.2rem}.stat span{font-size:.72rem;color:var(--muted)}.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1rem;margin-top:.8rem}.barline{height:9px;background:var(--border);border-radius:99px;overflow:hidden;margin:.4rem 0}.barline i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.kv{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;padding:.18rem 0}@media(max-width:650px){.row,.cover-row{grid-template-columns:1fr}.cover-row .preview{margin:auto}.stats{grid-template-columns:1fr 1fr}.user{display:none}}
</style>
</head>
<body>
<header><a class="back" href="index.html">← IzVault</a><div class="logo">Read<em>Vault</em></div><div class="head"><span class="sync" id="sync">● Cloud</span><span class="user" id="user"></span></div></header>
<main>
<div id="notice" class="notice"><h2>Login required</h2><p>Login to IzVault first so your reading list belongs to your account.</p><br><a class="btn primary" href="index.html">Go to IzVault Login</a></div>
<section id="app" hidden>
<div class="toolbar"><div class="search"><input class="input" id="search" placeholder="Search title, author, genre..."></div><select id="type" style="max-width:150px"><option value="">All Types</option><option>Novel</option><option>Manhwa</option><option>Manhua</option><option>Manga</option><option>Light Novel</option><option>Webtoon</option><option>Other</option></select><select id="sort" style="max-width:150px"><option value="newest">Newest</option><option value="title">A–Z</option><option value="rating">Rating</option><option value="progress">Progress</option></select><button class="btn primary" id="add">＋ Add</button></div>
<div class="tools"><button class="btn" id="analytics">📊 Analytics & Stats</button><button class="btn" id="export">⇩ Export</button><button class="btn" id="import">⇧ Import old data</button><input id="importFile" type="file" accept="application/json,.json" hidden></div>
<div class="tabs"><button class="tab active" data-status="">All <span class="count" id="c-all">0</span></button><button class="tab" data-status="Reading">📖 Reading <span class="count" id="c-reading">0</span></button><button class="tab" data-status="Completed">✅ Completed <span class="count" id="c-completed">0</span></button><button class="tab" data-status="On Hold">⏸ On Hold <span class="count" id="c-hold">0</span></button><button class="tab" data-status="Plan to Read">📌 Plan <span class="count" id="c-plan">0</span></button></div>
<div class="grid" id="grid"></div>
</section>
</main>
<div class="modal" id="bookModal"><div class="box"><div class="mh"><strong id="modalTitle">Add Entry</strong><button class="btn" data-close="bookModal">×</button></div><div class="mb">
<div class="group"><label>Auto detect from link</label><div class="detect"><input class="input" id="detectUrl" placeholder="https://site.com/book/..." type="url"><button class="btn primary" id="detectBtn">🔎 Detect</button></div><div class="statusmsg" id="detectMsg"></div></div>
<div class="cover-row group"><div><label>Cover</label><div class="preview" id="coverPreview">No cover</div></div><div><label>Upload cover</label><input class="input" id="coverFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><div class="hint">JPG/PNG/WEBP/GIF · max 6 MB</div><label style="margin-top:.7rem">or Cover URL</label><input class="input" id="coverUrl" type="url" placeholder="https://..."></div></div>
<div class="group"><label>Title *</label><input class="input" id="f-title"></div><div class="row"><div class="group"><label>Author</label><input class="input" id="f-author"></div><div class="group"><label>Genre</label><input class="input" id="f-genre"></div></div>
<div class="row"><div class="group"><label>Type</label><select id="f-type"><option>Novel</option><option>Manhwa</option><option>Manhua</option><option>Manga</option><option>Light Novel</option><option>Webtoon</option><option>Other</option></select></div><div class="group"><label>Status</label><select id="f-status"><option>Reading</option><option>Completed</option><option>On Hold</option><option>Plan to Read</option></select></div></div>
<div class="row"><div class="group"><label>Current Chapter</label><input class="input" id="f-cur" type="number" min="0" value="0"></div><div class="group"><label>Total Chapters</label><input class="input" id="f-total" type="number" min="0" value="0"></div></div><div class="group"><label>Read Link</label><input class="input" id="f-link" type="url" placeholder="https://..."></div><div class="group"><label>Rating (0–5)</label><input class="input" id="f-rating" type="number" min="0" max="5" value="0"></div><div class="group"><label>Notes / Review</label><textarea id="f-notes" rows="4" placeholder="Your thoughts..."></textarea></div><button class="save" id="save">Save to Cloud</button>
</div></div></div>
<div class="modal" id="statsModal"><div class="box"><div class="mh"><strong>Analytics & Stats</strong><button class="btn" data-close="statsModal">×</button></div><div class="mb" id="statsBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://imkbmemvoqbbedbljueu.supabase.co',SUPABASE_KEY='sb_publishable_Dosi6rJmV4SaGzLEClAYUA_1L2CdDfE',sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let user=null,books=[],filter='',editing=null,coverPath=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pct=b=>b.total_chapter?Math.min(100,Math.round((Number(b.current_chapter)||0)/Number(b.total_chapter)*100)):0;const stars=n=>'★'.repeat(Number(n)||0)+'☆'.repeat(5-(Number(n)||0));function showNotice(){$('notice').hidden=false;$('app').hidden=true}function showApp(){$('notice').hidden=true;$('app').hidden=false;$('user').textContent=user?.email||''}async function load(){$('sync').textContent='● Syncing...';const {data,error}=await sb.from('books').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(error){$('sync').textContent='● Cloud error';return alert(error.message)}books=data||[];$('sync').textContent='● Cloud synced';render();counts()}function filtered(){let a=books.slice(),q=$('search').value.toLowerCase(),t=$('type').value,s=$('sort').value;a=a.filter(b=>(!q||[b.title,b.author,b.genre].join(' ').toLowerCase().includes(q))&&(!t||b.type===t)&&(!filter||b.status===filter));if(s==='title')a.sort((x,y)=>x.title.localeCompare(y.title));if(s==='rating')a.sort((x,y)=>(y.rating||0)-(x.rating||0));if(s==='progress')a.sort((x,y)=>pct(y)-pct(x));return a}function render(){const a=filtered();$('grid').innerHTML=a.length?a.map(b=>`<article class="card"><div class="cover">${b.cover_url?`<img src="${esc(b.cover_url)}" alt="">`:'<div class="nocover">No cover</div>'}<span class="status">${esc(b.status)}</span></div><div class="body"><div class="title">${esc(b.title)}</div><div class="muted">${esc(b.author||b.type)} · Ch. ${b.current_chapter||0}${b.total_chapter?' / '+b.total_chapter:''}</div>${b.genre?`<div class="muted">${esc(b.genre)}</div>`:''}<div class="bar"><div class="fill" style="width:${pct(b)}%"></div></div><div class="bottom"><span class="stars">${stars(b.rating)}</span><span class="muted">${pct(b)}%</span></div></div><div class="actions"><button class="small" onclick="editBook(${b.id})">Edit</button>${b.link?`<button class="small" onclick="window.open('${esc(b.link)}','_blank','noopener')">Read</button>`:''}<button class="small delete" onclick="deleteBook(${b.id})">Delete</button></div></article>`).join(''):'<div class="empty"><h3>No entries found</h3><p>Add your first book.</p></div>'}function counts(){const n=s=>books.filter(b=>b.status===s).length;[['c-all',books.length],['c-reading',n('Reading')],['c-completed',n('Completed')],['c-hold',n('On Hold')],['c-plan',n('Plan to Read')]].forEach(([id,v])=>$(id).textContent=v)}function resetForm(){editing=null;coverPath=null;['f-title','f-author','f-genre','f-link','f-notes','coverUrl','detectUrl'].forEach(id=>$(id).value='');$('f-type').value='Novel';$('f-status').value='Reading';$('f-cur').value=0;$('f-total').value=0;$('f-rating').value=0;$('coverFile').value='';$('coverPreview').innerHTML='No cover';$('detectMsg').textContent=''}function openBook(b=null){resetForm();editing=b?.id||null;if(b){$('f-title').value=b.title||'';$('f-author').value=b.author||'';$('f-genre').value=b.genre||'';$('f-type').value=b.type||'Novel';$('f-status').value=b.status||'Reading';$('f-cur').value=b.current_chapter||0;$('f-total').value=b.total_chapter||0;$('f-link').value=b.link||'';$('f-rating').value=b.rating||0;$('f-notes').value=b.notes||'';$('coverUrl').value=b.cover_url||'';coverPath=b.cover_path||null;$('detectUrl').value=b.source_url||b.link||'';if(b.cover_url)$('coverPreview').innerHTML=`<img src="${esc(b.cover_url)}" alt="">`}$('bookModal').classList.add('show')}async function uploadCover(file){if(!file)return;if(file.size>6291456)throw Error('Cover mesti 6 MB atau kurang.');if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type))throw Error('Format cover mesti JPG, PNG, WEBP atau GIF.');const ext=file.type.split('/')[1].replace('jpeg','jpg'),path=`${user.id}/${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from('book-covers').upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;const {data}=sb.storage.from('book-covers').getPublicUrl(path);coverPath=path;$('coverUrl').value=data.publicUrl;$('coverPreview').innerHTML=`<img src="${esc(data.publicUrl)}" alt="">`}$('coverFile').onchange=async e=>{try{await uploadCover(e.target.files[0])}catch(err){alert(err.message)}};$('coverUrl').oninput=()=>{$('coverPreview').innerHTML=$('coverUrl').value?`<img src="${esc($('coverUrl').value)}" alt="">`:'No cover'};$('detectBtn').onclick=async()=>{const url=$('detectUrl').value.trim();if(!url)return alert('Masukkan link dahulu.');$('detectMsg').textContent='Detecting...';try{const r=await fetch('/.netlify/functions/fetch-book-metadata',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});const d=await r.json();if(!d.ok)throw Error(d.error);$('f-title').value=d.title||$('f-title').value;$('f-author').value=d.author||$('f-author').value;$('f-genre').value=d.genre||$('f-genre').value;$('f-total').value=d.total_chapter||$('f-total').value;$('coverUrl').value=d.cover_url||$('coverUrl').value;$('f-link').value=d.url||url;$('detectMsg').textContent='✓ Detected. Semak sebelum Save.';if(d.cover_url)$('coverPreview').innerHTML=`<img src="${esc(d.cover_url)}" alt="">`}catch(e){$('detectMsg').textContent='Tak dapat auto-detect: '+e.message+' — isi manual.'}};$('save').onclick=async()=>{const title=$('f-title').value.trim();if(!title)return alert('Title wajib diisi.');const payload={user_id:user.id,title,author:$('f-author').value.trim()||null,genre:$('f-genre').value.trim()||null,type:$('f-type').value,status:$('f-status').value,current_chapter:Math.max(0,Number($('f-cur').value)||0),total_chapter:Math.max(0,Number($('f-total').value)||0),cover_url:$('coverUrl').value.trim()||null,cover_path:coverPath,source_url:$('detectUrl').value.trim()||null,link:$('f-link').value.trim()||null,rating:Math.min(5,Math.max(0,Number($('f-rating').value)||0)),notes:$('f-notes').value.trim()||null};$('save').disabled=true;let r=editing?await sb.from('books').update(payload).eq('id',editing).eq('user_id',user.id):await sb.from('books').insert(payload);$('save').disabled=false;if(r.error)return alert(r.error.message);$('bookModal').classList.remove('show');await load()};window.editBook=id=>{const b=books.find(x=>x.id===id);if(b)openBook(b)};window.deleteBook=async id=>{if(!confirm('Padam entry ini?'))return;const b=books.find(x=>x.id===id);if(b?.cover_path)await sb.storage.from('book-covers').remove([b.cover_path]);const {error}=await sb.from('books').delete().eq('id',id).eq('user_id',user.id);if(error)return alert(error.message);await load()};
$('analytics').onclick=()=>{const total=books.length,done=books.filter(b=>b.status==='Completed').length,reading=books.filter(b=>b.status==='Reading').length,chap=books.reduce((n,b)=>n+(Number(b.current_chapter)||0),0),tc=books.reduce((n,b)=>n+(Number(b.total_chapter)||0),0),rated=books.filter(b=>Number(b.rating)>0),avg=rated.length?(rated.reduce((n,b)=>n+Number(b.rating),0)/rated.length).toFixed(1):'—',p=tc?Math.round(chap/tc*100):0;$('statsBody').innerHTML=`<div class="stats"><div class="stat"><span>Total books</span><b>${total}</b></div><div class="stat"><span>Completed</span><b>${done}</b></div><div class="stat"><span>Reading</span><b>${reading}</b></div><div class="stat"><span>Avg rating</span><b>${avg}</b></div></div><div class="panel"><div class="kv"><span>Chapters read</span><b>${chap}</b></div><div class="kv"><span>Total chapters</span><b>${tc||'—'}</b></div><div class="barline"><i style="width:${p}%"></i></div><div class="kv"><span>Overall progress</span><b>${p}%</b></div></div><div class="panel"><div class="kv"><span>On Hold</span><b>${books.filter(b=>b.status==='On Hold').length}</b></div><div class="kv"><span>Plan to Read</span><b>${books.filter(b=>b.status==='Plan to Read').length}</b></div><div class="kv"><span>Rated books</span><b>${rated.length}</b></div></div>`;$('statsModal').classList.add('show')};
$('export').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(books,null,2)],{type:'application/json'}));a.href=u;a.download=`izvault-reading-tracker-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(u)};$('import').onclick=()=>{const old=localStorage.getItem('rv3');if(old){try{const arr=JSON.parse(old);if(Array.isArray(arr)&&arr.length&&confirm(`Jumpa ${arr.length} data lama dalam phone ini. Import sekarang?`))return importBooks(arr)}catch{}}$('importFile').click()};$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const arr=JSON.parse(await f.text());if(!Array.isArray(arr))throw Error('Fail mesti JSON array.');await importBooks(arr)}catch(err){alert('Import gagal: '+err.message)}e.target.value=''};async function importBooks(arr){let added=0;for(const x of arr){const title=String(x.title||'').trim();if(!title||books.some(b=>b.title.toLowerCase()===title.toLowerCase()))continue;const p={user_id:user.id,title,author:x.author||null,genre:x.genre||null,type:x.type||'Other',status:x.status||'Plan to Read',current_chapter:Number(x.current_chapter??x.current??0)||0,total_chapter:Number(x.total_chapter??x.total??0)||0,cover_url:x.cover_url||x.cover||null,link:x.link||null,rating:Number(x.rating)||0,notes:x.notes||null,source_url:x.source_url||null};const r=await sb.from('books').insert(p);if(!r.error)added++}alert(`Import selesai: ${added} buku ditambah.`);await load()}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove('show'));document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('show')});$('add').onclick=()=>openBook();$('search').oninput=render;$('type').onchange=render;$('sort').onchange=render;document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');filter=t.dataset.status;render()});sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;if(user){showApp();load()}else showNotice()});(async()=>{const {data}=await sb.auth.getSession();user=data.session?.user||null;if(user){showApp();await load()}else showNotice()})();
</script>
</body></html>
